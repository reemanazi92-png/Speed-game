<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ تحدي السرعة - الإجابة</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 15px; text-align: center; }

    .header { margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .team-badge { display: inline-block; padding: 6px 14px; border-radius: 10px; font-weight: bold; margin-bottom: 5px; }
    .team-A { background: var(--blue-team); color: #fff; }
    .team-B { background: var(--red-team); color: #fff; }

    .question-box { background: var(--card-bg); border-radius: 14px; padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .question-text { font-size: 1.3rem; font-weight: bold; margin-top: 5px; color: #fff; }
    .category-badge { display: inline-block; background: var(--accent); color: #000; padding: 3px 8px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }

    .answers-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .answer-row {
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 10px;
      text-align: right;
    }

    .answer-row label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
    .answer-input-group { display: flex; gap: 8px; }

    .answer-input {
      flex-grow: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    .answer-input:disabled { opacity: 0.5; background: #1e293b; }

    .btn-submit {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; background: #475569; }

    .status-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 1000;
      justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    .status-overlay.active { display: flex; }
    .status-icon { font-size: 3.5rem; margin-bottom: 15px; }
    .status-title { font-size: 1.8rem; color: var(--accent); margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="screen-game">
    <div class="header">
      <div id="display-team-badge" class="team-badge">الفريق --</div>
      <div class="round-info" id="display-round-id">الجولة --</div>
    </div>

    <div class="question-box">
      <span class="category-badge" id="display-category">--</span>
      <div class="question-text" id="display-question">بانتظار السؤال...</div>
    </div>

    <div class="answers-container" id="inputs-container">
      <!-- 5 حقول إجابة متتالية -->
      <script>
        for (let i = 1; i <= 5; i++) {
          document.write(`
            <div class="answer-row">
              <label>الإجابة ${i}:</label>
              <div class="answer-input-group">
                <input type="text" id="input-ans-${i}" class="answer-input" placeholder="اكتب الإجابة..." disabled>
                <button id="btn-ans-${i}" class="btn-submit" onclick="sendAnswer(${i})" disabled>إرسال ➡️</button>
              </div>
            </div>
          `);
        }
      </script>
    </div>
  </div>

  <div id="overlay-status" class="status-overlay">
    <div class="status-icon" id="status-icon">⏳</div>
    <div class="status-title" id="status-title">بانتظار بدء الجولة...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب فريق الجوال من الرابط ?team=A أو ?team=B
    const urlParams = new URLSearchParams(window.location.search);
    const team = urlParams.get('team') || 'A';

    document.getElementById('display-team-badge').innerText = `الفريق ${team}`;
    document.getElementById('display-team-badge').className = `team-badge team-${team}`;

    const overlayStatus = document.getElementById('overlay-status');
    const statusTitle = document.getElementById('status-title');
    const statusIcon = document.getElementById('status-icon');

    // الاستماع لحالة اللعبة
    db.ref('gameState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('display-question').innerText = data.currentQuestion || "بانتظار السؤال...";
      document.getElementById('display-category').innerText = data.category || "عام";
      document.getElementById('display-round-id').innerText = `الجولة ${data.roundId || 1}`;

      if (data.status === 'started') {
        overlayStatus.classList.remove('active');
        syncInputStates();
      } else {
        overlayStatus.classList.add('active');
        if (data.status === 'finished') {
          statusIcon.innerText = "🏁";
          statusTitle.innerText = "انتهت الجولة!";
        } else {
          statusIcon.innerText = "⏳";
          statusTitle.innerText = "بانتظار البدء...";
        }
        disableAllInputs();
      }
    });

    // مزامنة حالة الخانات المكتملة
    function syncInputStates() {
      db.ref(`answers/team${team}`).once('value', (snapshot) => {
        const answers = snapshot.val() ? Object.values(snapshot.val()) : [];
        const currentCount = answers.length;

        for (let i = 1; i <= 5; i++) {
          const input = document.getElementById(`input-ans-${i}`);
          const btn = document.getElementById(`btn-ans-${i}`);

          if (i <= currentCount) {
            input.value = answers[i - 1].text;
            input.disabled = true;
                btn.disabled = true;
            btn.innerText = "تم ✅";
          } else if (i === currentCount + 1) {
            input.disabled = false;
            btn.disabled = false;
          } else {
            input.disabled = true;
            btn.disabled = true;
          }
        }
      });
    }

    // إرسال الإجابة المنفصلة إلى Firebase
    function sendAnswer(index) {
      const input = document.getElementById(`input-ans-${index}`);
      const text = input.value.trim();

      if (!text) return;

      const btn = document.getElementById(`btn-ans-${index}`);
      input.disabled = true;
      btn.disabled = true;

      db.ref(`answers/team${team}`).push({
        text: text,
        timestamp: Date.now()
      }).then(() => {
        syncInputStates();
      });
    }

    function disableAllInputs() {
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`input-ans-${i}`).disabled = true;
        document.getElementById(`btn-ans-${i}`).disabled = true;
      }
    }
  </script>
</body>
</html>
