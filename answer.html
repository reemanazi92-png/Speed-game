<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ تحدي السرعة - الإجابة</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 20px; text-align: center; }

    .header { margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
    .team-badge { display: inline-block; padding: 8px 16px; border-radius: 12px; font-weight: bold; margin-bottom: 10px;}
    .team-A { background: var(--blue-team); color: #fff; }
    .team-B { background: var(--red-team); color: #fff; }
    h1 { font-size: 1.8rem; margin-bottom: 5px; }
    .round-info { opacity: 0.8; font-size: 1rem; }

    .question-box { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
    .question-text { font-size: 1.6rem; font-weight: bold; margin-top: 10px; color: #fff;}
    .category-badge { display: inline-block; background: var(--accent); color: #000; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.8rem;}

    .answers-container {
        width: 100%;
        margin-bottom: 30px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .answer-row {
        background: rgba(0,0,0,0.2);
        padding: 15px;
        border-radius: 12px;
        text-align: right;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .answer-row label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #fff;
    }

    .answer-input-group {
        display: flex;
        gap: 10px;
    }

    .answer-input {
        flex-grow: 1;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #fff;
        font-size: 1rem;
    }

    .answer-input:disabled { opacity: 0.5; }

    .btn-submit {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        width: 100px;
    }

    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-submit.submitted { background: #334155; pointer-events: none;}

    /* Status Overlays */
    .screen-active { display: block; }
    .status-overlay {
        display: none;
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        z-index: 1000;
        justify-content: center; align-items: center; flex-direction: column;
        padding: 30px;
    }
    .status-overlay.active { display: flex; }
    .status-icon { font-size: 4rem; margin-bottom: 20px; }
    .status-title { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
    .status-text { opacity: 0.8; margin-bottom: 30px; }

    .btn-main {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff; border: none; padding: 16px 32px; border-radius: 16px;
      font-size: 1.25rem; font-weight: bold; cursor: pointer; text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="screen-game" class="screen-active">
    <div class="header">
      <div id="display-team-badge" class="team-badge">الفريق --</div>
      <h1 id="display-team-name">--</h1>
      <div class="round-info" id="display-round-id">الجولة - / -</div>
    </div>

    <div class="question-box">
        <span class="category-badge" id="display-category">--</span>
        <div class="question-text" id="display-question">بانتظار السؤال...</div>
    </div>

    <div class="answers-container">
        <!-- الإجابة 1 -->
        <div class="answer-row">
            <label>الإجابة 1:</label>
            <div class="answer-input-group">
                <input type="text" id="input-answer-1" class="answer-input" placeholder="اكتب الإجابة هنا..." disabled>
                <button id="btn-submit-1" class="btn-submit" onclick="submitSingleAnswer(1)" disabled>
                    إرسال <span id="icon-1">➡️</span>
                </button>
            </div>
        </div>

        <!-- الإجابة 2 -->

                    إرسال <span id="icon-2">➡️</span>
                </button>
            </div>
        </div>

        <!-- الإجابة 3 -->
        <div class="answer-row">
            <label>الإجابة 3:</label>
            <div class="answer-input-group">
                <input type="text" id="input-answer-3" class="answer-input" placeholder="اكتب الإجابة هنا..." disabled>
                <button id="btn-submit-3" class="btn-submit" onclick="submitSingleAnswer(3)" disabled>
                    إرسال <span id="icon-3">➡️</span>
                </button>
            </div>
        </div>

        <!-- الإجابة 4 -->
        <div class="answer-row">
            <label>الإجابة 4:</label>
            <div class="answer-input-group">
                <input type="text" id="input-answer-4" class="answer-input" placeholder="اكتب الإجابة هنا..." disabled>
                <button id="btn-submit-4" class="btn-submit" onclick="submitSingleAnswer(4)" disabled>
                    إرسال <span id="icon-4">➡️</span>
                </button>
            </div>
        </div>

        <!-- الإجابة 5 -->
        <div class="answer-row">
            <label>الإجابة 5:</label>
            <div class="answer-input-group">
                <input type="text" id="input-answer-5" class="answer-input" placeholder="اكتب الإجابة هنا..." disabled>
                <button id="btn-submit-5" class="btn-submit" onclick="submitSingleAnswer(5)" disabled>
                    إرسال <span id="icon-5">➡️</span>
                </button>
            </div>
        </div>
    </div>
  </div>

  <!-- Status Overlays -->
  <div id="overlay-waiting" class="status-overlay">
    <div class="status-icon">⏳</div>
    <div class="status-title">بانتظار البدء...
