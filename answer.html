<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ واجهة الإجابة - لعبة السرعة</title>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- External Config Script -->
  <script src="firebase-config.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .category-tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .question-box {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 25px;
      color: #fff;
      line-height: 1.5;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 1.1rem;
      margin-bottom: 15px;
      outline: none;
      text-align: center;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    .overlay h2 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .answers-list {
      margin-top: 20px;
      text-align: right;
      max-height: 200px;
      overflow-y: auto;
    }

    .answer-item {
      background: #0f172a;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 1rem;
      border-right: 4px solid var(--accent);
    }
  </style>
</head>

<body>

  <!-- شاشة الانتظار إذا لم تبدأ الجولة -->
  <div id="waiting-screen" class="overlay">
    <h2>⏳ في انتظار بدء الجولة...</h2>
    <p style="color: #94a3b8;">سيتم عرض السؤال فور بدئه من قبل المسؤول</p>
  </div>

  <!-- شاشة انتهاء الجولة -->
  <div id="finished-screen" class="overlay" style="display: none;">
    <h2>🏁 انتهت الجولة!</h2>
    <p style="color: #94a3b8;">استعد للجولة القادمة...</p>
  </div>

  <!-- واجهة إدخال الإجابة -->
  <div class="card">
    <div id="category-display" class="category-tag">🧠 ثقافة عامة</div>
    <div id="question-display" class="question-box">جاري تحميل السؤال...</div>

    <form id="answer-form">
      <select id="team-select" required>
        <option value="" disabled selected>اختر فريقك...</option>

        <option value="الفريق الأول">الفريق الأول</option>
        <option value="الفريق الثاني">الفريق الثاني</option>
        <option value="الفريق الثالث">الفريق الثالث</option>
        <option value="الفريق الرابع">الفريق الرابع</option>
      </select>

      <input type="text" id="answer-input" placeholder="اكتب إجابتك هنا..." autocomplete="off" required>

      <button type="submit" id="submit-btn">إرسال الإجابة 🚀</button>
    </form>

    <div class="answers-list" id="my-answers-list"></div>
  </div>

<script>
  let currentRoundId = 1;
  let gameStatus = "waiting";

  const waitingScreen = document.getElementById("waiting-screen");
  const finishedScreen = document.getElementById("finished-screen");
  const categoryDisplay = document.getElementById("category-display");
  const questionDisplay = document.getElementById("question-display");
  const answerForm = document.getElementById("answer-form");
  const answerInput = document.getElementById("answer-input");
  const teamSelect = document.getElementById("team-select");
  const myAnswersList = document.getElementById("my-answers-list");

  // استماع لحالة اللعبة من Firebase
  db.ref("games/gameState").on("value", (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    currentRoundId = data.roundId || 1;
    gameStatus = data.status || "waiting";

    categoryDisplay.innerText = data.category || "عام";
    questionDisplay.innerText = data.currentQuestion || "انتظر السؤال...";

    if (gameStatus === "started") {
      waitingScreen.style.display = "none";
      finishedScreen.style.display = "none";
    } else if (gameStatus === "finished") {
      waitingScreen.style.display = "none";
      finishedScreen.style.display = "flex";
    } else {
      waitingScreen.style.display = "flex";
      finishedScreen.style.display = "none";
    }

    listenToMyAnswers();
  });

  // إرسال الإجابة
  answerForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const teamId = teamSelect.value;
    const answerText = answerInput.value.trim();

    if (!teamId) {
      alert("الرجاء اختيار الفريق أولاً");
      return;
    }

    if (!answerText) return;

    if (gameStatus !== "started") {
      alert("الجولة ليست نَشِطة حالياً");
      return;
    }

    try {
      const answerRef = db.ref(`games/answers/${currentRoundId}/${teamId}`).push();
      await answerRef.set({
        text: answerText,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      answerInput.value = "";
      answerInput.focus();
    } catch (err) {
      console.error("خطأ في إرسال الإجابة:", err);
      alert("تعذر إرسال الإجابة، يرجى المحاولة مرة أخرى");
    }
  });

  // عرض الإجابات المرسلة للفريق في الجولة الحالية
  function listenToMyAnswers() {
    const teamId = teamSelect.value;
    if (!teamId) return;

    db.ref(`games/answers/${currentRoundId}/${teamId}`).on("value", (snapshot) => {
      myAnswersList.innerHTML = "";
      const answers = snapshot.val();
      if (answers) {
        Object.values(answers).forEach(ans => {
          const item = document.createElement("div");
          item.className = "answer-item";
          item.innerText = ans.text;
          myAnswersList.appendChild(item);
        });
      }
    });
  }

  teamSelect.addEventListener("change", listenToMyAnswers);
</script>

</body>
</html>
