<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ واجهة إدخال الإجابات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 15px; text-align: center; }

    .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .badge-team { padding: 6px 16px; border-radius: 20px; font-weight: 900; font-size: 1.1rem; }
    .badge-team.A { background: var(--blue-team); color: #fff; }
    .badge-team.B { background: var(--red-team); color: #fff; }

    .q-card {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .category-tag { color: var(--accent); font-weight: 700; margin-bottom: 5px; display: block; }
    .q-title { font-size: 1.4rem; font-weight: 900; }

    .inputs-container { display: flex; flex-direction: column; gap: 12px; }
    .input-row { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 1.1rem;
      text-align: right;
    }
    input[type="text"]:disabled { background: rgba(255,255,255,0.05); color: #64748b; }

    button.btn-send {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: 900;
      font-size: 1rem;
      color: #000;
      cursor: pointer;
    }
    button.btn-send:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

    .overlay-wait {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-size: 1.5rem;
      font-weight: 900;
    }
    .overlay-wait.hidden { display: none; }
  </style>
</head>
<body>

  <div class="overlay-wait" id="overlay-wait">
    ⏳ بانتظار بدء الجولة من الشاشة الرئيسية...
  </div>

  <div class="header-info">
    <div class="badge-team" id="team-badge">الفريق --</div>
    <div style="color: var(--accent); font-weight: 900;" id="display-round-id">الجولة 1</div>
  </div>

  <div class="q-card">
    <span class="category-tag" id="display-category">معلومات عامة</span>
    <div class="q-title" id="display-question">بانتظار السؤال...</div>
  </div>

  <div class="inputs-container">
    <div class="input-row">
      <input type="text" id="input-ans-1" placeholder="الإجابة 1" disabled>
      <button class="btn-send" id="btn-ans-1" onclick="sendAnswer(1)" disabled>إرسال</button>
    </div>
    <div class="input-row">
      <input type="text" id="input-ans-2" placeholder="الإجابة 2" disabled>
      <button class="btn-send" id="btn-ans-2" onclick="sendAnswer(2)" disabled>إرسال</button>
    </div>
    <div class="input-row">
      <input type="text" id="input-ans-3" placeholder="الإجابة 3" disabled>
      <button class="btn-send" id="btn-ans-3" onclick="sendAnswer(3)" disabled>إرسال</button>
    </div>
    <div class="input-row">
      <input type="text" id="input-ans-4" placeholder="الإجابة 4" disabled>
      <button class="btn-send" id="btn-ans-4" onclick="sendAnswer(4)" disabled>إرسال</button>
    </div>
    <div class="input-row">
      <input type="text" id="input-ans-5" placeholder="الإجابة 5" disabled>
      <button class="btn-send" id="btn-ans-5" onclick="sendAnswer(5)" disabled>إرسال</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://speed-game-reem-default-rtdb.firebaseio.com/",
      projectId: "speed-game-reem"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // معرفة الفريق (A أو B) من الرابط URL
    const urlParams = new URLSearchParams(window.location.search);
    const team = urlParams.get('team') || 'A';

    const teamBadge = document.getElementById('team-badge');
    teamBadge.innerText = `الفريق ${team === 'A' ? 'أ (الأزرق)' : 'ب (الأحمر)'}`;
    teamBadge.classList.add(team);

    const overlayWait = document.getElementById('overlay-wait');

    // 1. الاستماع للمسار الموحد الصحيح: games/gameState
    db.ref('games/gameState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('display-question').innerText = data.currentQuestion || "بانتظار السؤال...";
      document.getElementById('display-category').innerText = data.category || "عام";
      document.getElementById('display-round-id').innerText = `الجولة ${data.roundId || 1}`;

      // إخفاء شاشة الانتظار إذا كانت حالة اللعبة started
      if (data.status === 'started') {
        overlayWait.classList.add('hidden');
        syncInputStates();
      } else {
        overlayWait.classList.remove('hidden');
      }
    });

    // 2. مزامنة المدخلات والاحتفاظ بالإجابات المسجلة
    function syncInputStates() {
      db.ref(`games/answers/team${team}`).once('value', (snapshot) => {
        const answers = snapshot.val() ? Object.values(snapshot.val()) : [];
        const currentCount = answers.length;

        for (let i = 1; i <= 5; i++) {
          const input = document.getElementById(`input-ans-${i}`);
          const btn = document.getElementById(`btn-ans-${i}`);

          if (i <= currentCount) {
            input.value = answers[i - 1].text;
            input.disabled = true;
            btn.disabled = true;
            btn.innerText = "تم ✅";
          } else if (i === currentCount + 1) {
            input.disabled = false;
            btn.disabled = false;
            btn.innerText = "إرسال";
          } else {
            input.disabled = true;
            btn.disabled = true;
            btn.innerText = "إرسال";
          }
        }
      });
    }

    // 3. إرسال الإجابة للمسار الصحيح: games/answers
    function sendAnswer(index) {
      const input = document.getElementById(`input-ans-${index}`);
      const text = input.value.trim();
      if (!text) return;

      db.ref(`games/answers/team${team}`).push({
        text: text,
        timestamp: Date.now()
      }).then(() => syncInputStates());
    }
  </script>
</body>
</html>
