<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة التحدي والتنافس</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --team-a-color: #3b82f6;
      --team-a-bg: rgba(59, 130, 246, 0.15);
      --team-b-color: #ef4444;
      --team-b-bg: rgba(239, 68, 68, 0.15);
      --accent-color: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-color);
    }

    .header-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .mute-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 1.2rem;
      padding: 8px 15px;
      border-radius: 12px;
      cursor: pointer;
    }

    .scoreboard-summary {
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-badge {
      padding: 6px 16px;
      border-radius: 50px;
    }

    .score-badge.team-a {
      background: var(--team-a-bg);
      color: var(--team-a-color);
      border: 1px solid var(--team-a-color);
    }

    .score-badge.team-b {
      background: var(--team-b-bg);
      color: var(--team-b-color);
      border: 1px solid var(--team-b-color);
    }

    .categories-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, .cat-btn.selected {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    main {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      flex-grow: 1;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    .team-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .team-card.team-a { border-top: 5px solid var(--team-a-color); }
    .team-card.team-b { border-top: 5px solid var(--team-b-color); }

    .team-title {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .team-card.team-a .team-title { color: var(--team-a-color); }
    .team-card.team-b .team-title { color: var(--team-b-color); }

    .qr-container {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .answers-count {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .answers-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .answer-item {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .answer-item.correct {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #4ade80;
    }

    .answer-item.wrong {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .question-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 250px;
      position: relative;
    }

    .round-badge {
      position: absolute;
      top: -15px;
      background: var(--accent-color);
      color: #000;
      padding: 5px 20px;
      border-radius: 20px;
      font-weight: 900;
    }

    .category-tag {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 40px;
      border-radius: 20px;
      border: 2px solid var(--card-border);
    }

    .timer-warning {
      color: #ef4444;
      border-color: #ef4444;
      animation: pulse 1s infinite;
    }

    .start-btn {
      background: linear-gradient(45deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 40px 60px;
      border-radius: 30px;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .result-title {
      font-size: 2.5rem;
      color: var(--accent-color);
      margin-bottom: 20px;
      font-weight: 900;
    }

    .result-scores {
      font-size: 1.5rem;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">🎮 تحدي المجموعات</div>
    <div class="scoreboard-summary">
      <div class="score-badge team-a" id="score-team-a">🔵 الفريق أ: 0 نقطة</div>
      <div class="score-badge team-b" id="score-team-b">🔴 الفريق ب: 0 نقطة</div>
    </div>
    <div class="header-controls">
      <button class="mute-btn" id="mute-button" onclick="toggleMute()">🔊</button>
    </div>
  </header>

  <div class="categories-bar">
    <button class="cat-btn selected" onclick="selectCategory('الكل', this)">الكل</button>
    <button class="cat-btn" onclick="selectCategory('أمن سيبراني', this)">أمن سيبراني</button>
    <button class="cat-btn" onclick="selectCategory('شبكات', this)">شبكات</button>
    <button class="cat-btn" onclick="selectCategory('ثقافة عامة', this)">ثقافة عامة</button>
  </div>

  <main>
    <div class="team-card team-a">
      <div class="team-title">الفريق (أ)</div>
      <div class="qr-container" id="qrcode-team-a"></div>
      <div class="answers-count" id="count-team-a">0 / 5</div>
      <div class="answers-list" id="list-team-a"></div>
    </div>

    <div class="center-panel">
      <div class="question-card">
        <div class="round-badge" id="round-title">الجولة 1</div>
        <div class="category-tag" id="category-display">اضغط "بدء الجولة" للبدء</div>
        <div class="question-text" id="question-display">جاهز للتحدي؟</div>
      </div>

      <div class="timer-container">
        <div class="timer-display" id="timer-display">01:00</div>
        <button class="start-btn" onclick="startNextRound()">بدء الجولة 🚀</button>
      </div>
    </div>

    <div class="team-card team-b">
      <div class="team-title">الفريق (ب)</div>
      <div class="qr-container" id="qrcode-team-b"></div>
      <div class="answers-count" id="count-team-b">0 / 5</div>
      <div class="answers-list" id="list-team-b"></div>
    </div>
  </main>

  <div class="overlay" id="result-overlay">
    <div class="result-card">
      <div class="result-title" id="winner-title-header">🏆 انتهت الجولة!</div>
      <div class="result-scores" id="final-score">
        🔵 الفريق أ: 0
        <br>
        🔴 الفريق ب: 0
      </div>
      <div id="winner-text" style="margin-bottom: 20px; font-size: 1.2rem; color: var(--text-muted);"></div>
      <button class="start-btn" onclick="startNextRound()">الجولة التالية ⏩</button>
    </div>
  </div>

  <script>
    // 1. إعدادات Firebase
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. بنك الأسئلة
    const questionsBank = [
      {
        id: 1,
        category: "أمن سيبراني",
        question: "اذكر أحد عناصر مثلث السرية والنزاهة والتوفر (CIA Triad):",
        answers: ["السرية", "النزاهة", "التوفر", "Confidentiality", "Integrity", "Availability"]
      },
      {
        id: 2,
        category: "شبكات",
        question: "اذكر أحد بروتوكولات طبقة التطبيقات (Application Layer):",
        answers: ["HTTP", "HTTPS", "FTP", "DNS", "DHCP", "SSH", "SMTP"]
      },
      {
        id: 3,
        category: "ثقافة عامة",
        question: "اذكر إحدى قارات العالم:",
        answers: ["آسيا", "أفريقيا", "أوروبا", "أمريكا الشمالية", "أمريكا الجنوبية", "أستراليا", "أنتاركتيكا"]
      },
      {
        id: 4,
        category: "أمن سيبراني",
        question: "اذكر نوعاً من أنواع الهجمات السيبرانية الشهيرة:",
        answers: ["التصيد", "التصيد الاحتيالي", "Phishing", "Ransomware", "فدية", "DDoS", "Man in the middle"]
      }
    ];

    // 3. حالة اللعبة
    let currentRound = 1;
    let scoreTeamA = 0;
    let scoreTeamB = 0;
    let countTeamA = 0;
    let countTeamB = 0;
    
    let selectedCategory = "الكل";
    let currentQuestion = null;
    let timerInterval = null;
    let timeLeft = 60;
    let isMuted = false;

    // توليد الأكواد QR
    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    
    new QRCode(document.getElementById("qrcode-team-a"), {
      text: `${baseUrl}/player.html?team=A`,
      width: 100,
      height: 100
    });

    new QRCode(document.getElementById("qrcode-team-b"), {
      text: `${baseUrl}/player.html?team=B`,
      width: 100,
      height: 100
    });

    function selectCategory(cat, element) {
      selectedCategory = cat;
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    // 4. بدء الجولة وتصفية البيانات القديمة من Firebase
    async function startNextRound() {
      // إلغاء الـ Timer القديم
      clearInterval(timerInterval);

      // مسح الإجابات القديمة وحالة اللعبة السابقة لمنع التعليق
      await db.ref("answers").remove();
      await db.ref("gameState").remove();

      document.getElementById("result-overlay").classList.remove("active");

      // تصفية الأسئلة
      let filteredQuestions = questionsBank;
      if (selectedCategory !== "الكل") {
        filteredQuestions = questionsBank.filter(q => q.category === selectedCategory);
      }

      if (filteredQuestions.length === 0) {
        alert("لا توجد أسئلة متوفرة في هذا القسم!");
        return;
      }

      // اختيار سؤال عشوائي
      const randomIndex = Math.floor(Math.random() * filteredQuestions.length);
      currentQuestion = filteredQuestions[randomIndex];

      // إعادة ضبط الواجهة
      document.getElementById("round-title").innerText = `الجولة ${currentRound}`;
      document.getElementById("category-display").innerText = currentQuestion.category;
      document.getElementById("question-display").innerText = currentQuestion.question;

      countTeamA = 0;
      countTeamB = 0;
      document.getElementById("count-team-a").innerText = `0 / 5`;
      document.getElementById("count-team-b").innerText = `0 / 5`;
      document.getElementById("list-team-a").innerHTML = "";
      document.getElementById("list-team-b").innerHTML = "";

      // تعيين حالة اللعبة الجديدة
      await db.ref("gameState").set({
        round: currentRound,
        questionId: currentQuestion.id,
        status: "active"
      });

      startTimer(60);
    }

    function startTimer(seconds) {
      timeLeft = seconds;
      const timerDisplay = document.getElementById("timer-display");
      timerDisplay.classList.remove("timer-warning");

      timerInterval = setInterval(() => {
        timeLeft--;
        let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        let secs = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.innerText = `${mins}:${secs}`;

        if (timeLeft <= 10) {
          timerDisplay.classList.add("timer-warning");
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endRound("⏱️ انتهى الوقت!");
        }
      }, 1000);
    }

    // 5. استقبال الإجابات أثناء الجولة الفعالة فقط
    db.ref("answers").on("child_added", (snapshot) => {
      const data = snapshot.val();
      if (!data || !currentQuestion) return;

      const answerText = data.text ? data.text.trim() : "";
      const team = data.team;

      const isCorrect = currentQuestion.answers.some(
        ans => ans.toLowerCase() === answerText.toLowerCase()
      );

      addAnswerToList(team, answerText, isCorrect);

      if (isCorrect) {
        if (team === "A") {
          countTeamA++;
          scoreTeamA += 10;
          document.getElementById("count-team-a").innerText = `${countTeamA} / 5`;
        } else if (team === "B") {
          countTeamB++;
          scoreTeamB += 10;
          document.getElementById("count-team-b").innerText = `${countTeamB} / 5`;
        }
        updateScoreBoard();
      }

      if (countTeamA >= 5 || countTeamB >= 5) {
        clearInterval(timerInterval);
        const winner = countTeamA >= 5 ? "الفريق (أ)" : "الفريق (ب)";
        endRound(`🏆 فاز ${winner} في هذه الجولة!`);
      }

      snapshot.ref.remove();
    });

    function addAnswerToList(team, text, isCorrect) {
      const listId = team === "A" ? "list-team-a" : "list-team-b";
      const listEl = document.getElementById(listId);
      
      const item = document.createElement("div");
      item.className = `answer-item ${isCorrect ? 'correct' : 'wrong'}`;
      item.innerText = `${text} ${isCorrect ? '✓' : '✗'}`;
      
      listEl.appendChild(item);
      listEl.scrollTop = listEl.scrollHeight;
    }

    function updateScoreBoard() {
      document.getElementById("score-team-a").innerText = `🔵 الفريق أ: ${scoreTeamA} نقطة`;
      document.getElementById("score-team-b").innerText = `🔴 الفريق ب: ${scoreTeamB} نقطة`;
    }

    function endRound(message) {
      db.ref("gameState/status").set("ended");

      document.getElementById("winner-title-header").innerText = message;
      document.getElementById("winner-text").innerText = "جاهزون للجولة القادمة؟";
      document.getElementById("final-score").innerHTML = `
        🔵 الفريق أ: ${scoreTeamA} نقطة
        <br>
        🔴 الفريق ب: ${scoreTeamB} نقطة
      `;

      document.getElementById("result-overlay").classList.add("active");
      currentRound++;
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById("mute-button").innerText = isMuted ? "🔇" : "🔊";
    }
  </script>
</body>
</html>
