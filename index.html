    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
      --green-win: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 20px;
      text-align: center;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .round-title {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
    }

    .timer-container {
      background: var(--card-bg);
      border: 3px solid var(--accent);
      padding: 10px 30px;
      border-radius: 20px;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      transition: all 0.2s ease;
    }

    .timer-warning {
      border-color: var(--red-team);
      color: var(--red-team);
      animation: timerPulse 0.8s infinite;
    }

    @keyframes timerPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .category-badge {
      background: var(--accent);
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 900;
      display: inline-block;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
    }

    .arena-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .team-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
    }

    .team-card.team-a {
      border-color: var(--blue-team);
    }

    .team-card.team-b {
      border-color: var(--red-team);
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }

    .team-name {
      font-size: 1.8rem;
      font-weight: 900;
    }

    .team-counter {
      font-size: 1.2rem;
      background: rgba(255,255,255,0.1);
      padding: 5px 15px;
      border-radius: 12px;
    }

    .qr-box {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 0 auto 15px auto;
    }

    .qr-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .answers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
      flex-grow: 1;
    }

    .answer-item {
      padding: 12px 20px;
      border-radius: 12px;
      text-align: right;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .answer-item.correct {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .answer-item.wrong {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .result-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .result-overlay.active {
      display: flex;
    }

    .winner-title {
      font-size: 3rem;
      font-weight: 900;
      color: var(--green-win);
      margin-bottom: 10px;
    }

    .category-selection {
      margin-top: 20px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      max-width: 600px;
      width: 100%;
    }

    .category-title {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .category-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: #334155;
      color: #fff;
      border: 2px solid transparent;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn:hover,
    .cat-btn.selected {
      background: var(--accent);
      color: #000;
      border-color: #fff;
    }

    .btn-next-round {
      margin-top: 25px;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 1.4rem;
      font-weight: 900;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.2s ease;
    }

    .btn-next-round:hover {
      transform: scale(1.05);
    }

    .score-board {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .score-box {
      background: var(--card-bg);
      padding: 8px 20px;
      border-radius: 15px;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .score-a {
      border: 2px solid var(--blue-team);
    }

    .score-b {
      border: 2px solid var(--red-team);
    }

    .final-score {
      margin-top: 15px;
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 15px;
      font-size: 1.3rem;
      font-weight: 900;
    }

    .mute-button {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 1000;
      border: none;
      background: var(--card-bg);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    @media (max-width: 700px) {

      .arena-container {
        grid-template-columns: 1fr;
      }

      .question-text {
        font-size: 1.5rem;
      }

      .round-title {
        font-size: 1.5rem;
      }

      .timer-container {
        font-size: 2rem;
        padding: 8px 18px;
      }

    }
  </style>
</head>

let audioContext = null;


function getAudioContext() {

  if (!audioContext) {

    audioContext =
      new (window.AudioContext ||
      window.webkitAudioContext)();

  }

  return audioContext;

}


function playSound(type) {

  if (soundMuted) return;

  try {

    const ctx = getAudioContext();

    if (ctx.state === 'suspended') {
      ctx.resume();
    }

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    let frequency = 500;
    let duration = 0.12;

    if (type === 'correct') {
      frequency = 700;
      duration = 0.15;
    }

    if (type === 'wrong') {
      frequency = 220;
      duration = 0.18;
    }

    if (type === 'win') {
      frequency = 850;
      duration = 0.5;
    }

    if (type === 'time') {
      frequency = 1000;
      duration = 0.15;
    }

    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
      0.001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.2,
      ctx.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + duration
    );

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + duration
    );

  } catch (e) {}

}

function normalizeText(text) {

  return String(text || '')
    .trim()
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/[إأآٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ي')
    .replace(/ـ/g, '')
    .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, '')
    .replace(/^ال/, '');

}


function normalizeLetter(letter) {

  return normalizeText(letter);

}

  teamScores.B =
    Number(data.scoreB || 0);

    Array.isArray(data.usedQuestionIds)
  ) {

      data.usedQuestionIds
        .map(Number)
        .filter(Number.isFinite);

// =========================================================
// 📥 قراءة الإجابات وترتيبها
// =========================================================

function readAnswers(snapshot) {

  const value =
    snapshot.val();

  if (!value) {
    return [];
  }


  let answers =
    Array.isArray(value)
      ? value
      : Object.values(value);


  answers =
    answers.filter(
      item =>
        item &&
        typeof item === 'object'
    );


  answers.sort(
    (a, b) => {

      return (
        Number(a.timestamp || 0) -
        Number(b.timestamp || 0)
      );

    }
  );


  return answers;

}

// =========================================================
// 🧠 هل الإجابة صحيحة؟
/* ======================================================== */

function isAnswerCorrect(answer) {

  const cleanText =
    normalizeText(answer);


  if (!cleanText) {
    return false;
  }


  // 🔤 سؤال الحروف
  if (currentLetter) {

    const normalizedLetter =
      normalizeLetter(
        currentLetter
      );


    const startsWithLetter =
      cleanText.startsWith(
        normalizedLetter
      );


    const inBank =
      currentValidAnswers.some(
        valid => {

          return (
            normalizeText(valid) ===
            cleanText
          );

        }
      );


    return (
      startsWithLetter &&
      inBank
    );

  }


  // 📝 سؤال عادي
  return currentValidAnswers.some(
    valid => {

      return (
        normalizeText(valid) ===
        cleanText
      );

    }
  );

}

// 🛡️ إنشاء عنصر الإجابة
// =========================================================

function createAnswerElement(
  index,
  rawText,
  correct
) {

  const item =
    document.createElement('div');


  item.className =
    correct
      ? 'answer-item correct'
      : 'answer-item wrong';


  const left =
    document.createElement('span');


  const number =
    document.createElement('b');


  number.innerText =
    `${index}. `;


  left.appendChild(number);


  left.appendChild(
    document.createTextNode(
      rawText
    )
  );


  const right =
    document.createElement('span');


  right.innerText =
    correct
      ? '✅ صحيحة'
      : '❌ خاطئة';


  item.appendChild(left);

  item.appendChild(right);


  return item;

}


// =========================================================
// ✅ معالجة الإجابات
// =========================================================

function processAnswers(
  team,
  answers
) {

  const listElement =
    team === 'A'
      ? document.getElementById(
          'list-team-a'
        )
      : document.getElementById(
          'list-team-b'
        );


  const countElement =
    team === 'A'
      ? document.getElementById(
          'count-team-a'
        )
      : document.getElementById(
          'count-team-b'
        );


  listElement.innerHTML = '';


  let correctCount = 0;


  const usedWords =
    new Set();


  answers.forEach(
    (ans, idx) => {

      const rawText =
        String(
          ans?.text || ''
        ).trim();


      const cleanText =
        normalizeText(
          rawText
        );


      const correct =
        isAnswerCorrect(
          rawText
        );


      const notDuplicate =
        cleanText.length > 0 &&
        !usedWords.has(
          cleanText
        );


      const finalCorrect =
        correct &&
        notDuplicate;


      if (finalCorrect) {

        correctCount++;

        usedWords.add(
          cleanText
        );

      }


      const item =
        createAnswerElement(
          idx + 1,
          rawText,
          finalCorrect
        );


      listElement.appendChild(
        item
      );

    }
  );


  countElement.innerText =
    `${correctCount} / 5`;


  // لا يمكن إعلان فائز
  // إذا لم تكن الجولة فعالة
  if (
    !isGameRunning ||
    currentGameStatus !== 'started'
  ) {

    return;

  }


  if (
    correctCount >= 5 &&
    !roundWinnerLocked &&
    !finishLock
  ) {

    finishRound(team);

  }

}


// =========================================================
// 🏆 إنهاء الجولة — Transaction آمن
// =========================================================

function finishRound(team) {

  if (
    finishLock ||
    !isGameRunning ||
    currentGameStatus !== 'started'
  ) {

    return;

  }


  finishLock = true;

  roundWinnerLocked = true;

  const winningRoundId =
    currentRoundId;


  stopTimer();


  const winnerName =
    team === 'A'
      ? 'الفريق أ (الأزرق)'
      : 'الفريق ب (الأحمر)';


  db.ref(
    'games/gameState'
  ).transaction(
    current => {

      if (!current) {

        return;

      }


      // إذا فاز فريق قبله
      if (
        current.status !==
        'started'
      ) {

        return;

      }


      // حماية من الجولة القديمة
      if (
        Number(current.roundId) !==
        Number(winningRoundId)
      ) {

        return;

      }


      const scoreA =
        Number(
          current.scoreA || 0
        );


      const scoreB =
        Number(
          current.scoreB || 0
        );


      return {

        ...current,

        status:
          'finished',

        roundWinner:
          team,

        winner:
          `🎉 فوز بالسرعة! ${winnerName} حقق 5 إجابات صحيحة أولاً!`,

        scoreA:
          team === 'A'
            ? scoreA + 1
            : scoreA,

        scoreB:
          team === 'B'
            ? scoreB + 1
            : scoreB

      };

    }
  )
  .then(result => {

    if (
      result.committed
    ) {

      playSound('win');

    }

    else {

      finishLock = false;

      roundWinnerLocked = false;

    }

  })
  .catch(error => {

    console.error(
      'خطأ في إنهاء الجولة:',
      error
    );

    finishLock = false;

    roundWinnerLocked = false;

  });

}

async function startNextRound() {

  if (
    isGameRunning ||
    startingRound
  ) {

    return;

  }


  startingRound = true;

  finishLock = false;

  roundWinnerLocked = false;

  currentGameStatus =
    'transitioning';


  stopTimer();


  try {

    // ---------------------------------
    // الأسئلة المتاحة حسب القسم
    // ---------------------------------

    const categoryQuestions =
      questionsBank.filter(
        q => {

          return (
            selectedCategory ===
              'الكل' ||
            q.category ===
              selectedCategory
          );

        }
      );


    if (
      categoryQuestions.length ===
      0
    ) {

      alert(
        'لا توجد أسئلة في هذا القسم.'
      );

      currentGameStatus =
        'waiting';

      return;

    }


    // ---------------------------------
    // الأسئلة غير المستخدمة
    // ---------------------------------

    const usedSet =
      new Set(
        usedQuestionIds.map(
          Number
        )
      );


    let availableQuestions =
      categoryQuestions.filter(
        q =>
          !usedSet.has(
            Number(q.id)
          )
      );


    // ---------------------------------
    // إذا انتهى قسم معين
    // نعيد أسئلته فقط
    // ---------------------------------

    if (
      availableQuestions.length ===
      0
    ) {

      const categoryIds =
        new Set(
          categoryQuestions.map(
            q =>
              Number(q.id)
          )
        );


      usedQuestionIds =
        usedQuestionIds.filter(
          id =>
            !categoryIds.has(
              Number(id)
            )
        );


      availableQuestions =
        categoryQuestions.slice();

    }


    if (
      availableQuestions.length ===
      0
    ) {

      alert(
        'لا توجد أسئلة متاحة.'
      );

      currentGameStatus =
        'waiting';

      return;

    }


    // ---------------------------------
    // اختيار سؤال عشوائي
    // ---------------------------------

    const selectedQuestion =
      availableQuestions[
        Math.floor(
          Math.random() *
          availableQuestions.length
        )
      ];


    // ---------------------------------
    // إضافة السؤال إلى المستخدم
    // ---------------------------------

    const nextUsedIds =
      Array.from(
        new Set([
          ...usedQuestionIds.map(
            Number
          ),
          Number(
            selectedQuestion.id
          )
        ])
      );


    const nextRound =
      Number(currentRoundId || 0) +
      1;


    // ---------------------------------
    // الحالة الجديدة
    // ---------------------------------

    const newGameState = {

      roundId:
        nextRound,

      currentQuestion:
        selectedQuestion.question,

      category:
        selectedQuestion.category,

      letter:
        selectedQuestion.letter ||
        null,

      validAnswers:
        selectedQuestion.answers,

      status:
        'started',

      winner:
        '',

      roundWinner:
        '',

      duration:
        60,

      scoreA:
        Number(teamScores.A || 0),

      scoreB:
        Number(teamScores.B || 0),

      // 🔥 حفظ الأسئلة المستخدمة في Firebase
      usedQuestionIds:
        nextUsedIds

    };


    // ---------------------------------
    // أولاً نحذف إجابات الجولة القديمة
    // ---------------------------------

    await db.ref(
      'games/answers'
    ).remove();


    // ---------------------------------
    // ثم نكتب الجولة الجديدة
    // ---------------------------------

    await db.ref(
      'games/gameState'
    ).set(
      newGameState
    );


    // حفظ نسخة محلية أيضًا
    usedQuestionIds =
      nextUsedIds;

    saveLocalUsedQuestions();


    // 🔥 لا نشغل المؤقت هنا
    // مستمع Firebase هو المسؤول عنه
    // حتى لا يبدأ مرتين

  }

  catch (error) {

    console.error(
      'خطأ في بدء الجولة:',
      error
    );


    alert(
      'حدث خطأ أثناء بدء الجولة. تأكدي من اتصال Firebase.'
    );


    currentGameStatus =
      'waiting';

  }

  finally {

    startingRound =
      false;

  }

}


// =========================================================
// ⏱️ تشغيل المؤقت
// =========================================================

function startLocalTimer(
  duration,
  roundId
) {

  const numericRoundId =
    Number(roundId);


  // 🔥 إذا كان مؤقت نفس الجولة يعمل
  // لا تعيده من البداية
  if (
    activeTimerRoundId ===
      numericRoundId &&
    isGameRunning
  ) {

    return;

  }


  clearInterval(
    timerInterval
  );


  timerInterval =
    null;


  activeTimerRoundId =
    numericRoundId;


  isGameRunning =
    true;


  currentGameStatus =
    'started';


  roundWinnerLocked =
    false;


  finishLock =
    false;


  timerSeconds =
    Number(duration) || 60;


  const timerDisplay =
    document.getElementById(
      'timer-display'
    );


  timerDisplay.classList.remove(
    'timer-warning'
  );


  updateTimerDisplay();


  timerInterval =
    setInterval(
      () => {

        if (
          !isGameRunning ||
          activeTimerRoundId !==
            numericRoundId
        ) {

          return;

        }


        timerSeconds--;


        updateTimerDisplay();


        // آخر 10 ثواني
        if (
          timerSeconds <= 10 &&
          timerSeconds > 0
        ) {

          timerDisplay.classList.add(
            'timer-warning'
          );


          playSound('time');

        }


        if (
          timerSeconds <= 0
        ) {

          handleTimeOut(
            numericRoundId
          );

        }

      },
      1000
    );

}


// =========================================================
// ⏰ انتهاء الوقت
// =========================================================

function handleTimeOut(
  roundId
) {

  if (
    !isGameRunning ||
    finishLock ||
    currentGameStatus !==
      'started'
  ) {

    return;

  }


  finishLock = true;

  roundWinnerLocked = true;

  stopTimer();


  db.ref(
    'games/gameState'
  ).transaction(
    current => {

      if (!current) {

        return;

      }


      if (
        current.status !==
        'started'
      ) {

        return;

      }


      if (
        Number(current.roundId) !==
        Number(roundId)
      ) {

        return;

      }


      return {

        ...current,

        status:
          'finished',

        roundWinner:
          '',

        winner:
          '⏰ انتهى الوقت! لا يوجد فائز في هذه الجولة.'

      };

    }
  )
  .then(result => {

    if (
      result.committed
    ) {

      playSound('wrong');

    }

    else {

      finishLock = false;

      roundWinnerLocked = false;

    }

  })
  .catch(error => {

    console.error(
      'خطأ في انتهاء الوقت:',
      error
    );

    finishLock = false;

    roundWinnerLocked = false;

  });

}


// =========================================================
// ⏱️ تحديث المؤقت
// =========================================================

function updateTimerDisplay() {

  const mins =
    Math.floor(
      timerSeconds / 60
    )
    .toString()
    .padStart(
      2,
      '0'
    );


  const secs =
    (
      timerSeconds % 60
    )
    .toString()
    .padStart(
      2,
      '0'
    );


  document.getElementById(
    'timer-display'
  ).innerText =
    `${mins}:${secs}`;

}


// =========================================================
// 🛑 إيقاف المؤقت
// =========================================================

function stopTimer() {

  isGameRunning =
    false;


  clearInterval(
    timerInterval
  );


  timerInterval =
    null;


  activeTimerRoundId =
    null;


  document
    .getElementById(
      'timer-display'
    )
    .classList.remove(
      'timer-warning'
    );

}


// =========================================================
// 🆕 تشغيل اللعبة لأول مرة
// =========================================================

async function initializeGame() {

  updateScoreBoard();

  updateTimerDisplay();


  // ---------------------------------
  // إذا طلبت لعبة جديدة
  // ---------------------------------

  if (forceNewGame) {

    try {

      await resetGame();


      // إزالة ?newgame=1 من الرابط
      // بدون إعادة تحميل الصفحة
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

    }

    catch (error) {

      console.error(
        'خطأ في إعادة اللعبة:',
        error
      );

      alert(
        'تعذر إنشاء لعبة جديدة.'
      );

    }

  }


  // ---------------------------------
  // بعد التأكد من الحالة
  // نبدأ مستمع Firebase
  // ---------------------------------

  bindFirebaseListeners();

}


// =========================================================
// 🎬 تشغيل
// =========================================================

initializeGame();

</script>
