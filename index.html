    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
      --green-win: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 20px; text-align: center; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .round-title { font-size: 2rem; font-weight: 900; color: var(--accent); }
    
    .timer-container {
      background: var(--card-bg);
      border: 3px solid var(--accent);
      padding: 10px 30px;
      border-radius: 20px;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .category-badge {
      background: var(--accent);
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 900;
      display: inline-block;
      margin-bottom: 10px;
    }

    .question-text { font-size: 2rem; font-weight: 900; color: #fff; }

    .arena-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .team-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
    }

    .team-card.team-a { border-color: var(--blue-team); }
    .team-card.team-b { border-color: var(--red-team); }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }

    .team-name { font-size: 1.8rem; font-weight: 900; }
    .team-counter {
      font-size: 1.2rem;
      background: rgba(255,255,255,0.1);
      padding: 5px 15px;
      border-radius: 12px;
    }

    .qr-box {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 0 auto 15px auto;
    }

    .qr-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .answers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
      flex-grow: 1;
    }

    .answer-item {
      padding: 12px 20px;
      border-radius: 12px;
      text-align: right;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .answer-item.correct {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .answer-item.wrong {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .result-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .result-overlay.active { display: flex; }

    .winner-title {
      font-size: 3rem;
      font-weight: 900;
      color: var(--green-win);
      margin-bottom: 10px;
    }

    .category-selection {
      margin-top: 20px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      max-width: 600px;
      width: 100%;
    }

    .category-title {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .category-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: #334155;
      color: #fff;
      border: 2px solid transparent;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn:hover,
    .cat-btn.selected {
      background: var(--accent);
      color: #000;
      border-color: #fff;
    }

    .btn-next-round {
      margin-top: 25px;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 1.4rem;
      font-weight: 900;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.2s ease;
    }

    .btn-next-round:hover {
      transform: scale(1.05);
    }

    @media (max-width: 700px) {
      .arena-container {
        grid-template-columns: 1fr;
      }

      .question-text {
        font-size: 1.5rem;
      }

      .round-title {

      }

      .timer-container {
        font-size: 2rem;
        padding: 8px 18px;
      }
    }

</head>

        question: "اذكر 5 كلمات تبدأ بحرف الطاء (ط)؟",
        letter: "ط",
        answers: [
          "طائرة", "طاولة", "طبيب", "طماطم",
          "طريق", "طفل", "طبل", "طاووس",
          "طعام", "طقس"
        ]
      }

    ];


    // =========================================================
    // ⚙️ متغيرات اللعبة
    // =========================================================

    let currentValidAnswers = [];
    let currentLetter = null;
    let timerSeconds = 60;
    let timerInterval = null;
    let isGameRunning = false;
    let currentRoundId = 0;
    let selectedCategory = 'الكل';
    let usedQuestionIds = [];


    // =========================================================
    // 📱 إنشاء QR
    // =========================================================

    window.addEventListener('DOMContentLoaded', () => {

      const baseUrl =
        window.location.href.substring(
          0,
          window.location.href.lastIndexOf('/')
        );

      new QRCode(
        document.getElementById("qrcode-team-a"),
        {
          text: `${baseUrl}/answer.html?team=A`,
          width: 110,
          height: 110
        }
      );

      new QRCode(
        document.getElementById("qrcode-team-b"),
        {
          text: `${baseUrl}/answer.html?team=B`,
          width: 110,
          height: 110
        }
      );

    });


    // =========================================================
    // 🎯 اختيار القسم
    // =========================================================

    function selectCategory(cat) {

      selectedCategory = cat;

      const buttons =
        document.querySelectorAll('.cat-btn');

      buttons.forEach(btn => {

        btn.classList.remove('selected');

        if (
          btn.innerText.includes(cat) ||
          (
            cat === 'الكل' &&
            btn.innerText.includes('عشوائي')
          )
        ) {
          btn.classList.add('selected');
        }

      });

    }


    // =========================================================
    // 🧹 توحيد الكتابة العربية
    // =========================================================

    function normalizeText(text) {

      return String(text || '')
        .trim()
        .toLowerCase()

        // إزالة التشكيل
        .replace(/[\u064B-\u065F\u0670]/g, '')

        // توحيد الهمزات
        .replace(/[إأآٱ]/g, 'ا')

        // توحيد الألف المقصورة
        .replace(/ى/g, 'ي')

        // توحيد التاء المربوطة والهاء
        .replace(/ة/g, 'ه')

        // توحيد الهمزة على الواو
        .replace(/ؤ/g, 'و')

        // توحيد الهمزة على الياء
        .replace(/ئ/g, 'ي')

        // إزالة التطويل
        .replace(/ـ/g, '')

        // إزالة المسافات والرموز وعلامات الترقيم
        .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, '')

        // إزالة "ال" من بداية الكلمة
        .replace(/^ال/, '');
    }


    // =========================================================
    // 🔤 توحيد الحرف
    // =========================================================

    function normalizeLetter(letter) {

      return normalizeText(letter);
    }


    // =========================================================
    // 🎮 استقبال حالة اللعبة من Firebase
    // =========================================================

    db.ref('games/gameState').on('value', (snapshot) => {

      const data = snapshot.val();

      if (!data) return;

      currentRoundId = data.roundId || 1;

      document.getElementById('question-display').innerText =
        data.currentQuestion || "بانتظار السؤال...";

      document.getElementById('category-display').innerText =
        data.category || "عام";

      document.getElementById('round-title').innerText =
        `الجولة ${currentRoundId}`;

      currentValidAnswers =
        data.validAnswers || [];

      currentLetter =
        data.letter || null;


      if (data.status === 'started') {

        document
          .getElementById('result-overlay')
          .classList.remove('active');

        if (!isGameRunning) {

          startLocalTimer(
            data.duration || 60
          );

        }

      }

      else if (data.status === 'finished') {

        stopTimer();

        document.getElementById(
          'winner-title-header'
        ).innerText = "🏆 انتهت الجولة";

        document.getElementById(
          'winner-text'
        ).innerText =
          data.winner || "انتهت الجولة";

        document
          .getElementById('result-overlay')
          .classList.add('active');
      }

    });


    // =========================================================
    // 🔵 إجابات الفريق أ
    // =========================================================

    db.ref('games/answers/teamA').on('value', (snapshot) => {

      processAnswers(
        'A',
        snapshot.val()
          ? Object.values(snapshot.val())
          : []
      );

    });


    // =========================================================
    // 🔴 إجابات الفريق ب
    // =========================================================

    db.ref('games/answers/teamB').on('value', (snapshot) => {

      processAnswers(
        'B',
        snapshot.val()
          ? Object.values(snapshot.val())
          : []
      );

    });


    // =========================================================
    // ✅ فحص الإجابات
    // =========================================================

    function processAnswers(team, answers) {

      const listElement =
        team === 'A'
          ? document.getElementById('list-team-a')
          : document.getElementById('list-team-b');

      const countElement =
        team === 'A'
          ? document.getElementById('count-team-a')
          : document.getElementById('count-team-b');


      listElement.innerHTML = '';

      let correctCount = 0;

      // يمنع تكرار نفس الإجابة
      let usedWords = new Set();


      answers.forEach((ans, idx) => {

        const item =
          document.createElement('div');

        const rawText =
          String(ans.text || '').trim();

        const cleanText =
          normalizeText(rawText);


        let isCorrect = false;


        // =====================================================
        // 🔤 أسئلة الحروف
        // =====================================================

        if (currentLetter) {

          const normalizedLetter =
            normalizeLetter(currentLetter);

          const startsWithLetter =
            cleanText.startsWith(
              normalizedLetter
            );


          // لازم تكون الإجابة موجودة فعليًا في البنك
          const inBank =
            currentValidAnswers.some(v => {

              return normalizeText(v) === cleanText;

            });


          isCorrect =
            startsWithLetter &&
            inBank;

        }


        // =====================================================
        // 📝 الأسئلة العادية
        // =====================================================

        else {

          isCorrect =
            currentValidAnswers.some(v => {

              return normalizeText(v) === cleanText;

            });

        }


        // =====================================================
        // 🚫 منع التكرار
        // =====================================================

        const isNotDuplicate =
          !usedWords.has(cleanText);


        if (
          isCorrect &&
          isNotDuplicate &&
          cleanText.length > 0
        ) {

          correctCount++;

          usedWords.add(cleanText);

          item.className =
            'answer-item correct';

          item.innerHTML =
            `<span>
              <b>${idx + 1}.</b> ${rawText}
            </span>
            <span>✅ صحيحة</span>`;

        }

        else {

          item.className =
            'answer-item wrong';

          item.innerHTML =
            `<span>
              <b>${idx + 1}.</b> ${rawText}
            </span>
            <span>❌ خاطئة</span>`;

        }


        listElement.appendChild(item);

      });


      countElement.innerText =
        `${correctCount} / 5`;


      // =====================================================
      // 🏆 فوز الفريق
      // =====================================================

      if (
        correctCount >= 5 &&
        isGameRunning
      ) {

        stopTimer();

        const winnerName =
          team === 'A'
            ? 'الفريق أ (الأزرق)'
            : 'الفريق ب (الأحمر)';


        db.ref('games/gameState').update({

          status: 'finished',

          winner:
            `🎉 فوز بالسرعة! ${winnerName} حقق 5 إجابات صحيحة أولاً!`

        });

      }

    }


    // =========================================================
    // 🚀 بدء الجولة التالية
    // =========================================================

    function startNextRound() {

      let availableQuestions =
        questionsBank.filter(
          q => !usedQuestionIds.includes(q.id)
        );


      // فلترة حسب القسم
      if (selectedCategory !== 'الكل') {

        availableQuestions =
          availableQuestions.filter(
            q => q.category === selectedCategory
          );

      }


      // إذا انتهت الأسئلة
      if (availableQuestions.length === 0) {

        usedQuestionIds =
          usedQuestionIds.filter(id => {

            const q =
              questionsBank.find(
                item => item.id === id
              );

            return selectedCategory !== 'الكل' &&
                   q
              ? q.category !== selectedCategory
              : false;

          });


        availableQuestions =
          questionsBank.filter(
            q =>
              selectedCategory === 'الكل' ||
              q.category === selectedCategory
          );

      }


      // اختيار سؤال عشوائي
      const selectedQuestion =
        availableQuestions[
          Math.floor(
            Math.random() *
            availableQuestions.length
          )
        ];


      usedQuestionIds.push(
        selectedQuestion.id
      );


      // مسح إجابات الجولة السابقة
      db.ref('games/answers').remove();


      // تحديث Firebase
      db.ref('games/gameState').set({

        roundId:
          currentRoundId + 1,

        currentQuestion:
          selectedQuestion.question,

        category:
          selectedQuestion.category,

        letter:
          selectedQuestion.letter || null,

        validAnswers:
          selectedQuestion.answers,

        status:
          'started',

        winner:
          '',

        duration:
          60

      }).then(() => {

        document
          .getElementById('result-overlay')
          .classList.remove('active');

        startLocalTimer(60);

      });

    }


    // =========================================================
    // ⏱️ المؤقت
    // =========================================================

    function startLocalTimer(duration) {

      isGameRunning = true;

      timerSeconds = duration;

      clearInterval(timerInterval);


      // عرض البداية فورًا
      const mins =
        Math.floor(
          timerSeconds / 60
        )
        .toString()
        .padStart(2, '0');

      const secs =
        (timerSeconds % 60)
        .toString()
        .padStart(2, '0');

      document.getElementById(
        'timer-display'
      ).innerText =
        `${mins}:${secs}`;


      timerInterval =
        setInterval(() => {

          timerSeconds--;


          const mins =
            Math.floor(
              timerSeconds / 60
            )
            .toString()
            .padStart(2, '0');


          const secs =
            (timerSeconds % 60)
            .toString()
            .padStart(2, '0');


          document.getElementById(
            'timer-display'
          ).innerText =
            `${mins}:${secs}`;


          if (timerSeconds <= 0) {

            stopTimer();


            db.ref('games/gameState').update({

              status:
                'finished',

              winner:
                '⏰ انتهى الوقت!'

            });

          }

        }, 1000);

    }


    // =========================================================
    // 🛑 إيقاف المؤقت
    // =========================================================

    function stopTimer() {

      isGameRunning = false;

      clearInterval(timerInterval);

    }

  </script>

</body>
