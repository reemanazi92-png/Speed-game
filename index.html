    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
      --green-win: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 20px;
      text-align: center;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .round-title {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
    }

    .timer-container {
      background: var(--card-bg);
      border: 3px solid var(--accent);
      padding: 10px 30px;
      border-radius: 20px;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      transition: all 0.2s ease;
    }

    .timer-warning {
      border-color: var(--red-team);
      color: var(--red-team);
      animation: timerPulse 0.8s infinite;
    }

    @keyframes timerPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .category-badge {
      background: var(--accent);
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 900;
      display: inline-block;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
    }

    .arena-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .team-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
    }

    .team-card.team-a {
      border-color: var(--blue-team);
    }

    .team-card.team-b {
      border-color: var(--red-team);
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }

    .team-name {
      font-size: 1.8rem;
      font-weight: 900;
    }

    .team-counter {
      font-size: 1.2rem;
      background: rgba(255,255,255,0.1);
      padding: 5px 15px;
      border-radius: 12px;
    }

    .qr-box {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 0 auto 15px auto;
    }

    .qr-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .answers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
      flex-grow: 1;
    }

    .answer-item {
      padding: 12px 20px;
      border-radius: 12px;
      text-align: right;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .answer-item.correct {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .answer-item.wrong {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .result-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .result-overlay.active {
      display: flex;
    }

    .winner-title {
      font-size: 3rem;
      font-weight: 900;
      color: var(--green-win);
      margin-bottom: 10px;
    }

    .category-selection {
      margin-top: 20px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      max-width: 600px;
      width: 100%;
    }

    .category-title {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .category-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: #334155;
      color: #fff;
      border: 2px solid transparent;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn:hover,
    .cat-btn.selected {
      background: var(--accent);
      color: #000;
      border-color: #fff;
    }

    .btn-next-round {
      margin-top: 25px;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 1.4rem;
      font-weight: 900;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.2s ease;
    }

    .btn-next-round:hover {
      transform: scale(1.05);
    }

    .score-board {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .score-box {
      background: var(--card-bg);
      padding: 8px 20px;
      border-radius: 15px;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .score-a {
      border: 2px solid var(--blue-team);
    }

    .score-b {
      border: 2px solid var(--red-team);
    }

    .final-score {
      margin-top: 15px;
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 15px;
      font-size: 1.3rem;
      font-weight: 900;
    }

    .mute-button {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 1000;
      border: none;
      background: var(--card-bg);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    @media (max-width: 700px) {

      .arena-container {
        grid-template-columns: 1fr;
      }

      .question-text {
        font-size: 1.5rem;
      }

      .round-title {
        font-size: 1.5rem;
      }

      .timer-container {
        font-size: 2rem;
        padding: 8px 18px;
      }

    }
  </style>
</head>

let currentValidAnswers = [];

// =========================================================
// 🔊 نظام الأصوات
// =========================================================

const audioContext =
  new (window.AudioContext || window.webkitAudioContext)();


function playSound(type) {

  if (soundMuted) return;

  try {

    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(audioContext.destination);


    let frequency = 500;

    let duration = 0.12;


    if (type === 'correct') {
      frequency = 700;
      duration = 0.15;
    }

    if (type === 'wrong') {
      frequency = 220;
      duration = 0.18;
    }

    if (type === 'win') {
      frequency = 850;
      duration = 0.5;
    }

    if (type === 'time') {
      frequency = 1000;
      duration = 0.15;
    }


    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.2,
      audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + duration
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + duration
    );

  } catch (e) {}

}


function toggleMute() {

  soundMuted = !soundMuted;

  document.getElementById('mute-button').innerText =

    btn.classList.remove('selected');


    if (

        btn.innerText.includes('عشوائي')

    ) {

      btn.classList.add('selected');

    }

  });

}



// =========================================================
// 🧹 توحيد الكتابة العربية
// =========================================================

function normalizeText(text) {

  return String(text || '')
    .trim()
    .toLowerCase()

    // إزالة التشكيل
    .replace(/[\u064B-\u065F\u0670]/g, '')

    // توحيد الهمزات
    .replace(/[إأآٱ]/g, 'ا')

    // توحيد الألف المقصورة
    .replace(/ى/g, 'ي')

    // توحيد التاء المربوطة
    .replace(/ة/g, 'ه')

    // توحيد الهمزة على الواو
    .replace(/ؤ/g, 'و')

    // توحيد الهمزة على الياء
    .replace(/ئ/g, 'ي')

    // إزالة التطويل
    .replace(/ـ/g, '')

    // إزالة الرموز
    .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, '')

    // إزالة ال التعريف
    .replace(/^ال/, '');

}



// =========================================================
// 🔤 الحرف
// =========================================================

function normalizeLetter(letter) {

  return normalizeText(letter);

}

  document.getElementById('category-display').innerText =
    data.category ||

  document.getElementById('round-title').innerText =
    `الجولة ${currentRoundId}`;


  currentValidAnswers =
    data.validAnswers || [];


  currentLetter =
    data.letter || null;


  // استرجاع النقاط من Firebase
  teamScores.A =
    Number(data.scoreA || 0);

  teamScores.B =
    Number(data.scoreB || 0);


  updateScoreBoard();


  if (data.status === 'started') {

    roundWinnerLocked = false;

    document
      .getElementById('result-overlay')
      .classList.remove('active');


    if (!isGameRunning) {

      startLocalTimer(
        data.duration || 60
      );

    }

  }


  else if (data.status === 'finished') {

    stopTimer();


    showRoundResult(data);

  }

});

// =========================================================
// ✅ فحص الإجابات
// =========================================================

function processAnswers(team, answers) {

  const listElement =
    team === 'A'
      ? document.getElementById('list-team-a')
      : document.getElementById('list-team-b');


  const countElement =
    team === 'A'
      ? document.getElementById('count-team-a')
      : document.getElementById('count-team-b');


  listElement.innerHTML = '';


  let correctCount = 0;


  const usedWords = new Set();


  answers.forEach((ans, idx) => {

    const item =
      document.createElement('div');


    const rawText =
      String(ans.text || '').trim();


    const cleanText =
      normalizeText(rawText);


    let isCorrect = false;


    // ============================
    // 🔤 تحدي الحروف
    // ============================

    if (currentLetter) {

      const normalizedLetter =
        normalizeLetter(currentLetter);


      const startsWithLetter =
        cleanText.startsWith(
          normalizedLetter
        );


      const inBank =
        currentValidAnswers.some(v => {

          return normalizeText(v) === cleanText;

        });


      isCorrect =
        startsWithLetter &&
        inBank;

    }


    // ============================
    // 📝 السؤال العادي
    // ============================

    else {

      isCorrect =
        currentValidAnswers.some(v => {

          return normalizeText(v) === cleanText;

        });

    }


    const isNotDuplicate =
      !usedWords.has(cleanText);


    if (
      isCorrect &&
      isNotDuplicate &&
      cleanText.length > 0
    ) {

      correctCount++;

      usedWords.add(cleanText);


      item.className =
        'answer-item correct';


      item.innerHTML =
        `<span>
          <b>${idx + 1}.</b> ${escapeHTML(rawText)}
        </span>
        <span>✅ صحيحة</span>`;

    }

    else {

      item.className =
        'answer-item wrong';


      item.innerHTML =
        `<span>
          <b>${idx + 1}.</b> ${escapeHTML(rawText)}
        </span>
        <span>❌ خاطئة</span>`;

    }


    listElement.appendChild(item);

  });


  countElement.innerText =
    `${correctCount} / 5`;


  // ============================
  // 🏆 الفوز
  // ============================

  if (
    correctCount >= 5 &&
    isGameRunning &&
    !roundWinnerLocked
  ) {

    roundWinnerLocked = true;

    stopTimer();

    finishRound(team);

  }

}



// =========================================================
// 🛡️ حماية عرض النص
// =========================================================

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}



// =========================================================
// 🏆 إنهاء الجولة
// =========================================================

function finishRound(team) {

  const winnerName =
    team === 'A'
      ? 'الفريق أ (الأزرق)'
      : 'الفريق ب (الأحمر)';


  const oldScore =
    teamScores[team];


  const newScore =
    oldScore + 1;


  teamScores[team] =
    newScore;


  updateScoreBoard();


  playSound('win');


  db.ref('games/gameState').transaction(current => {

    if (!current) return current;


    if (current.status === 'finished') {
      return;
    }


    return {

      ...current,

      status:'finished',

      winner:
        `🎉 فوز بالسرعة! ${winnerName} حقق 5 إجابات صحيحة أولاً!`,

      scoreA:
        team === 'A'
          ? newScore
          : Number(current.scoreA || 0),

      scoreB:
        team === 'B'
          ? newScore
          : Number(current.scoreB || 0)

    };

  });

}



// =========================================================
// 🚀 الجولة التالية
// =========================================================

function startNextRound() {

  roundWinnerLocked = false;


  let availableQuestions =
    questionsBank.filter(
      q => !usedQuestionIds.includes(q.id)
    );


  if (selectedCategory !== 'الكل') {

    availableQuestions =
      availableQuestions.filter(
        q =>
          q.category === selectedCategory
      );

  }


  // إذا انتهت أسئلة القسم
  if (availableQuestions.length === 0) {

    usedQuestionIds = [];


    availableQuestions =
      questionsBank.filter(
        q =>
          selectedCategory === 'الكل' ||
          q.category === selectedCategory
      );

  }


  if (!availableQuestions.length) {

    alert('لا توجد أسئلة متاحة.');

    return;

  }


  const selectedQuestion =
    availableQuestions[
      Math.floor(
        Math.random() *
        availableQuestions.length
      )
    ];


  usedQuestionIds.push(
    selectedQuestion.id
  );


  // مسح إجابات الجولة السابقة
  db.ref('games/answers').remove();


  const nextRound =
    currentRoundId + 1;


  db.ref('games/gameState').set({

    roundId:
      nextRound,

    currentQuestion:
      selectedQuestion.question,

    category:
      selectedQuestion.category,

    letter:
      selectedQuestion.letter || null,

    validAnswers:
      selectedQuestion.answers,

    status:
      'started',

    winner:
      '',

    duration:
      60,

    scoreA:
      teamScores.A,

    scoreB:
      teamScores.B

  }).then(() => {

    document
      .getElementById('result-overlay')
      .classList.remove('active');


    startLocalTimer(60);

  });

}



// =========================================================
// ⏱️ المؤقت
// =========================================================

function startLocalTimer(duration) {

  isGameRunning = true;

  roundWinnerLocked = false;

  timerSeconds = duration;


  clearInterval(timerInterval);


  const timerDisplay =
    document.getElementById(
      'timer-display'
    );


  timerDisplay.classList.remove(
    'timer-warning'
  );


  updateTimerDisplay();


  timerInterval =
    setInterval(() => {

      if (!isGameRunning) return;


      timerSeconds--;


      updateTimerDisplay();


      if (
        timerSeconds <= 10 &&
        timerSeconds > 0
      ) {

        timerDisplay.classList.add(
          'timer-warning'
        );


        playSound('time');

      }


      if (timerSeconds <= 0) {

        stopTimer();


        if (roundWinnerLocked) return;


        roundWinnerLocked = true;


        db.ref('games/gameState').transaction(current => {

          if (!current) return current;


          if (current.status === 'finished') {
            return;
          }


          return {

            ...current,

            status:'finished',

            winner:
              '⏰ انتهى الوقت! لا يوجد فائز في هذه الجولة.'

          };

        });

      }

    }, 1000);

}



// =========================================================
// ⏱️ تحديث المؤقت
// =========================================================

function updateTimerDisplay() {

  const mins =
    Math.floor(
      timerSeconds / 60
    )
    .toString()
    .padStart(2,'0');


  const secs =
    (timerSeconds % 60)
    .toString()
    .padStart(2,'0');


  document.getElementById(
    'timer-display'
  ).innerText =
    `${mins}:${secs}`;

}



// =========================================================
// 🛑 إيقاف المؤقت
// =========================================================

function stopTimer() {

  isGameRunning = false;

  clearInterval(timerInterval);


  document
    .getElementById(
      'timer-display'
    )
    .classList.remove(
      'timer-warning'
    );

}



// =========================================================
// 🎬 تشغيل أولي

updateScoreBoard();
