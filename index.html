<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ تحدي السرعة - الشاشة الرئيسية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
      --green-win: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 25px; text-align: center; overflow-x: hidden; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .round-title { font-size: 2rem; font-weight: 900; color: var(--accent); }
    
    .timer-container {
      background: var(--card-bg);
      border: 3px solid var(--accent);
      padding: 10px 30px;
      border-radius: 20px;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .timer-container.danger { border-color: var(--red-team); color: var(--red-team); animation: pulse 1s infinite; }

    .question-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .category-badge {
      background: var(--accent);
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1.1rem;
      display: inline-block;
      margin-bottom: 10px;
    }
    .question-text { font-size: 2.2rem; font-weight: 900; line-height: 1.4; color: #fff; }

    .arena-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }

    .team-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid transparent;
    }
    .team-card.team-a { border-color: var(--blue-team); }
    .team-card.team-b { border-color: var(--red-team); }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }
    .team-name { font-size: 1.8rem; font-weight: 900; }
    .team-counter { font-size: 1.2rem; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 12px; }

    .answers-list { display: flex; flex-direction: column; gap: 10px; min-height: 250px; }
    .answer-item {
      background: #0f172a;
      padding: 12px 20px;
      border-radius: 12px;
      text-align: right;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
      animation: slideIn 0.3s ease-out;
    }
    .answer-num { font-weight: bold; opacity: 0.5; margin-left: 10px; }

    .result-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .result-overlay.active { display: flex; }
    .winner-title { font-size: 3.5rem; font-weight: 900; color: var(--green-win); margin-bottom: 15px; }
    .winner-subtitle { font-size: 2rem; opacity: 0.9; margin-bottom: 25px; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="round-title" id="round-title">الجولة --</div>
    <div class="timer-container" id="timer-display">01:00</div>
  </div>

  <div class="question-card">
    <span class="category-badge" id="category-display">الفئة</span>
    <div class="question-text" id="question-display">بانتظار بدء الجولة...</div>
  </div>

  <div class="arena-container">
    <div class="team-card team-a">
      <div class="team-header">
        <div class="team-name" style="color: var(--blue-team);">الفريق أ</div>
        <div class="team-counter" id="count-team-a">0 / 5</div>
      </div>
      <div class="answers-list" id="list-team-a"></div>
    </div>

    <div class="team-card team-b">
      <div class="team-header">
        <div class="team-name" style="color: var(--red-team);">الفريق ب</div>
        <div class="team-counter" id="count-team-b">0 / 5</div>
      </div>
      <div class="answers-list" id="list-team-b"></div>
    </div>
  </div>

  <div class="result-overlay" id="result-overlay">
    <div class="winner-title" id="winner-title">🏆 انتهت الجولة</div>
    <div class="winner-subtitle" id="winner-text">--</div>
  </div>

  <script>
    // ضع إعدادات مشروع Firebase الخاص بك هنا
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let timerInterval = null;
    let isRoundFinished = false;

    const timerDisplay = document.getElementById('timer-display');
    const listTeamA = document.getElementById('list-team-a');
    const listTeamB = document.getElementById('list-team-b');
    const countTeamA = document.getElementById('count-team-a');
    const countTeamB = document.getElementById('count-team-b');
    const resultOverlay = document.getElementById('result-overlay');
    const winnerText = document.getElementById('winner-text');

    // الاستماع لحالة الجولة والمؤقت
    db.ref('gameState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('question-display').innerText = data.currentQuestion || "بانتظار السؤال...";
      document.getElementById('category-display').innerText = data.category || "عام";
      document.getElementById('round-title').innerText = `الجولة ${data.roundId || 1}`;

      if (data.status === 'started') {
        isRoundFinished = false;
        resultOverlay.classList.remove('active');
        runTimer(data.startTime, data.duration || 60);
      } else if (data.status === 'stopped' || data.status === 'finished') {
        stopTimer();
        if (data.winner) {
          showWinner(data.winner);
        }
      }
    });

    // متابعة إجابات الفريق أ
    db.ref('answers/teamA').on('value', (snapshot) => {
      const data = snapshot.val();
      const answers = data ? Object.values(data) : [];
      renderAnswers('A', answers);
      checkSpeedWin('A', answers);
    });

    // متابعة إجابات الفريق ب
    db.ref('answers/teamB').on('value', (snapshot) => {
      const data = snapshot.val();
      const answers = data ? Object.values(data) : [];
      renderAnswers('B', answers);
      checkSpeedWin('B', answers);
    });

    function renderAnswers(team, answers) {
      const listElement = team === 'A' ? listTeamA : listTeamB;
      const countElement = team === 'A' ? countTeamA : countTeamB;
      
      listElement.innerHTML = '';
      answers.forEach((ans, idx) => {
        const item = document.createElement('div');
        item.className = 'answer-item';
        item.innerHTML = `<span><span class="answer-num">${idx + 1}.</span> ${ans.text}</span> <span>✅</span>`;
        listElement.appendChild(item);
      });

      countElement.innerText = `${answers.length} / 5`;
    }

    // التحقق الفوري من إنجاز الـ 5 إجابات لإيقاف التيمر فوراً
    function checkSpeedWin(team, answers) {
      if (answers.length >= 5 && !isRoundFinished) {
        isRoundFinished = true;
        stopTimer();

        const winnerTeamName = team === 'A' ? 'الفريق أ (الأزرق)' : 'الفريق ب (الأحمر)';
        
        // تحديث حالة السيرفر لإعلام الجوال والشاشة بالتوقف الفوري
        db.ref('gameState').update({
          status: 'finished',
          winner: winnerTeamName
        });
      }
    }

    function runTimer(startTime, duration) {
      clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        const now = Date.now();
        const elapsed = Math.floor((now - startTime) / 1000);
        const remaining = duration - elapsed;

        if (remaining <= 0) {
          stopTimer();
          if (!isRoundFinished) {
            isRoundFinished = true;
            db.ref('gameState').update({ status: 'finished', winner: 'time_up' });
          }
        } else {
          formatTimerDisplay(remaining);
        }
      }, 500);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function showWinner(winner) {
      if (winner === 'time_up') {
        winnerText.innerText = "⏰ انتهى الوقت! تقييم الإجابات حسب العدد الصحيح.";
      } else {
        winnerText.innerText = `🎉 فوز بالسرعة! ${winner} أكمل 5 إجابات أولاً!`;
      }
      resultOverlay.classList.add('active');
    }

    function formatTimerDisplay(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      
      if (seconds <= 10) {
        timerDisplay.classList.add('danger');
      } else {
        timerDisplay.classList.remove('danger');
      }
    }
  </script>
</body>
</html>
