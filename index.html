<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ تحدي السرعة - الشاشة الرئيسية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- مكتبة توليد الباركود -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --blue-team: #3b82f6;
      --red-team: #ef4444;
      --accent: #f59e0b;
      --text-white: #f8fafc;
      --green-win: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 20px; text-align: center; overflow-x: hidden; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .round-title { font-size: 2rem; font-weight: 900; color: var(--accent); }
    
    .timer-container {
      background: var(--card-bg);
      border: 3px solid var(--accent);
      padding: 10px 30px;
      border-radius: 20px;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .timer-container.danger { border-color: var(--red-team); color: var(--red-team); animation: pulse 1s infinite; }

    .question-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .category-badge {
      background: var(--accent);
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1.1rem;
      display: inline-block;
      margin-bottom: 10px;
    }
    .question-text { font-size: 2rem; font-weight: 900; line-height: 1.4; color: #fff; }

    .arena-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .team-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
    }
    .team-card.team-a { border-color: var(--blue-team); }
    .team-card.team-b { border-color: var(--red-team); }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }
    .team-name { font-size: 1.8rem; font-weight: 900; }
    .team-counter { font-size: 1.2rem; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 12px; }

    .qr-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 0 auto 15px auto;
    }
    .qr-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; font-weight: bold; }

    .answers-list { display: flex; flex-direction: column; gap: 10px; min-height: 200px; flex-grow: 1; }
    .answer-item {
      background: #0f172a;
      padding: 12px 20px;
      border-radius: 12px;
      text-align: right;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .result-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .result-overlay.active { display: flex; }
    .winner-title { font-size: 3.5rem; font-weight: 900; color: var(--green-win); margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="round-title" id="round-title">الجولة --</div>
    <div class="timer-container" id="timer-display">01:00</div>
  </div>

  <div class="question-card">
    <span class="category-badge" id="category-display">الفئة</span>
    <div class="question-text" id="question-display">بانتظار بدء الجولة...</div>
  </div>

  <div class="arena-container">
    <div class="team-card team-a">
      <div class="team-header">
        <div class="team-name" style="color: var(--blue-team);">الفريق أ</div>
        <div class="team-counter" id="count-team-a">0 / 5</div>
      </div>
      <div class="qr-title">امسح للولوج كـ (الفريق أ)</div>
      <div class="qr-box"><div id="qrcode-team-a"></div></div>
      <div class="answers-list" id="list-team-a"></div>
    </div>

    <div class="team-card team-b">
      <div class="team-header">
        <div class="team-name" style="color: var(--red-team);">الفريق ب</div>
        <div class="team-counter" id="count-team-b">0 / 5</div>
      </div>
      <div class="qr-title">امسح للولوج كـ (الفريق ب)</div>
      <div class="qr-box"><div id="qrcode-team-b"></div></div>
      <div class="answers-list" id="list-team-b"></div>
    </div>
  </div>

  <div class="result-overlay" id="result-overlay">
    <div class="winner-title">🏆 انتهت الجولة</div>
    <div style="font-size: 2rem;" id="winner-text">--</div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://speed-game-reem-default-rtdb.firebaseio.com/",
      projectId: "speed-game-reem"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let timerInterval = null;

    // توليد الباركود تلقائياً
    window.addEventListener('DOMContentLoaded', () => {
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
      new QRCode(document.getElementById("qrcode-team-a"), { text: `${baseUrl}/answer.html?team=A`, width: 110, height: 110 });
      new QRCode(document.getElementById("qrcode-team-b"), { text: `${baseUrl}/answer.html?team=B`, width: 110, height: 110 });
    });

    // الاستماع لمسار games/gameState
    db.ref('games/gameState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('question-display').innerText = data.currentQuestion || "بانتظار السؤال...";
      document.getElementById('category-display').innerText = data.category || "عام";
      document.getElementById('round-title').innerText = `الجولة ${data.roundId || 1}`;

      if (data.status === 'started') {
        document.getElementById('result-overlay').classList.remove('active');
        runTimer(data.startTime || Date.now(), data.duration || 60);
      } else if (data.status === 'finished') {
        clearInterval(timerInterval);
        document.getElementById('winner-text').innerText = data.winner || "انتهت الجولة";
        document.getElementById('result-overlay').classList.add('active');
      }
    });

    // استماع إجابات الفرق
    db.ref('games/answers/teamA').on('value', (snapshot) => {
      renderAnswers('A', snapshot.val() ? Object.values(snapshot.val()) : []);
    });

    db.ref('games/answers/teamB').on('value', (snapshot) => {
      renderAnswers('B', snapshot.val() ? Object.values(snapshot.val()) : []);
    });

    function renderAnswers(team, answers) {
      const listElement = team === 'A' ? document.getElementById('list-team-a') : document.getElementById('list-team-b');
      const countElement = team === 'A' ? document.getElementById('count-team-a') : document.getElementById('count-team-b');
      
      listElement.innerHTML = '';
      answers.forEach((ans, idx) => {
        const item = document.createElement('div');
        item.className = 'answer-item';
        item.innerHTML = `<span><b>${idx + 1}.</b> ${ans.text}</span> <span>✅</span>`;
        listElement.appendChild(item);
      });

      countElement.innerText = `${answers.length} / 5`;
    }

    function runTimer(startTime, duration) {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const remaining = duration - elapsed;

        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer-display').innerText = "00:00";
        } else {
          const mins = Math.floor(remaining / 60).toString().padStart(2, '0');
          const secs = (remaining % 60).toString().padStart(2, '0');
          document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        }
      }, 500);
    }
  </script>
</body>
</html>
