<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎛️ لوحة التحكم - لعبة السرعة</title>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- External Project Scripts -->
  <script src="firebase-config.js"></script>
  <script src="questions.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #334155;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .badge.started { background: var(--green); color: #000; }
    .badge.waiting { background: var(--accent); color: #000; }
    .badge.finished { background: var(--red); color: #fff; }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: scale(0.98); }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-blue { background: var(--blue); color: #fff; }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 1rem;
      margin-top: 10px;
      outline: none;
    }

    .current-q-box {
      font-size: 1.3rem;
      font-weight: 900;
      text-align: center;
      padding: 15px;
      background: #0f172a;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px dashed var(--accent);
    }
  </style>
</head>

<body>

  <h1>🎛️ لوحة إدارة اللعبة</h1>

  <!-- شريط الحالة الحالية -->
  <div class="status-bar">
    <div>الحالة: <span id="game-status" class="badge waiting">جاري التحميل...</span></div>
    <div>الجولة الحالية: <span id="round-num" style="color: var(--accent);">--</span></div>
  </div>

  <!-- التحكم بالجولة والسؤال -->
  <div class="card">
    <h3>❓ اختيار السؤال</h3>
    
    <div class="current-q-box" id="current-question-display">
      لم يتم اختيار سؤال بعد
    </div>

    <div style="margin-top: 15px;">
      <label>أو اختر سؤالاً يدوياً من البنك:</label>
      <select id="questions-select">
        <option value="">-- اختر سؤالاً من القائمة --</option>
      </select>
    </div>

    <div class="btn-group">
      <button class="btn-blue" onclick="pickRandomQuestion()">🎲 سؤال عشوائي</button>
      <button class="btn-success" onclick="startRound()">🚀 بدء الجولة</button>
      <button class="btn-danger" onclick="endRound()">🏁 إنهاء الجولة</button>
    </div>
  </div>

  <!-- التنقل بين الجولات والتصفير -->
  <div class="card">
    <h3>⚙️ إعدادات الإدارة</h3>
    <div class="btn-group">
      <button class="btn-primary" onclick="nextRound()">➡️ الجولة التالية</button>
      <button class="btn-danger" onclick="resetGame()">🔄 إعادة تصفير اللعبة بالكامل</button>
    </div>
  </div>

<script>
  const selectEl = document.getElementById("questions-select");
  const currentQDisplay = document.getElementById("current-question-display");
  const gameStatusEl = document.getElementById("game-status");
  const roundNumEl = document.getElementById("round-num");

  let currentRoundId = 1;
  let selectedQuestion = null;

  // تعبئة القائمة المنسدلة بالأسئلة من QUESTIONS_BANK
  if (typeof QUESTIONS_BANK !== 'undefined') {
    QUESTIONS_BANK.forEach((q, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.innerText = `[${q.category}] ${q.text}`;
      selectEl.appendChild(opt);
    });
  }

  selectEl.addEventListener("change", (e) => {
    const index = e.target.value;
    if (index !== "") {
      selectedQuestion = QUESTIONS_BANK[index];
      currentQDisplay.innerText = `${selectedQuestion.category}: ${selectedQuestion.text}`;
    }
  });

  // استماع لحالة اللعبة الحالية من Firebase
  db.ref("games/gameState").on("value", (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      gameStatusEl.innerText = "غير معروفة";
      gameStatusEl.className = "badge waiting";
      roundNumEl.innerText = "1";
      return;
    }

    currentRoundId = data.roundId || 1;
    roundNumEl.innerText = currentRoundId;

    const status = data.status || "waiting";
    if (status === "started") {
      gameStatusEl.innerText = "جارية 🚀";
      gameStatusEl.className = "badge started";
    } else if (status === "finished") {
      gameStatusEl.innerText = "منتهية 🏁";
      gameStatusEl.className = "badge finished";
    } else {
      gameStatusEl.innerText = "انتظار ⏳";
      gameStatusEl.className = "badge waiting";
    }

    if (data.currentQuestion) {
      currentQDisplay.innerText = `${data.category || ''}: ${data.currentQuestion}`;
    }
  });

  // اختيار سؤال عشوائي
  function pickRandomQuestion() {
    if (typeof QUESTIONS_BANK === 'undefined' || QUESTIONS_BANK.length === 0) return;
    const randomIndex = Math.floor(Math.random() * QUESTIONS_BANK.length);
    selectedQuestion = QUESTIONS_BANK[randomIndex];
    selectEl.value = randomIndex;
    currentQDisplay.innerText = `${selectedQuestion.category}: ${selectedQuestion.text}`;
  }

  // بدء الجولة
  async function startRound() {
    if (!selectedQuestion) {
      alert("الرجاء اختيار سؤال أولاً أو الضغط على سؤال عشوائي");
      return;
    }

    await db.ref("games/gameState").set({
      roundId: currentRoundId,
      status: "started",
      currentQuestion: selectedQuestion.text,
      category: selectedQuestion.category
    });
  }

  // إنهاء الجولة
  async function endRound() {
    await db.ref("games/gameState/status").set("finished");
  }

  // الانتقال للجولة التالية
  async function nextRound() {
    currentRoundId++;
    selectedQuestion = null;
    selectEl.value = "";
    currentQDisplay.innerText = "اختر سؤالاً للجولة الجديدة";

    await db.ref("games/gameState").set({
      roundId: currentRoundId,
      status: "waiting",
      currentQuestion: "",
      category: ""
    });
  }

  // تصفير اللعبة بالكامل
  async function resetGame() {
    if (confirm("هل أنت تأكد من إعادة تصفير اللعبة وحذف جميع الإجابات والجولات؟")) {
      await db.ref("games").set({
        gameState: {
          roundId: 1,
          status: "waiting",
          currentQuestion: "",
          category: ""
        }
      });
      alert("تم إعادة التصفير بنجاح");
    }
  }
</script>

</body>
</html>
